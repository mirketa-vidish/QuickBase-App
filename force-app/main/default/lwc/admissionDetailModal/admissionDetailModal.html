<template>
    <lightning-modal-header label="Admission Details"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-record-view-form record-id={recordId} object-api-name="Opportunity">
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Admission_ID__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="MBC_ID__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Admission_Date__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Discharge_Date__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="StageName"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Client_First_Name__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Client_Middle_Name__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Client_Last_Name__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Program__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Facility_Approved__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Admitted_Level_of_Care__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Discharged_Level_of_Care__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="Anticipated_Realm__c"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="CreatedById"></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <lightning-output-field field-name="LastModifiedById"></lightning-output-field>
                </div>
            </div>
        </lightning-record-view-form>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Close" onclick={handleClose}></lightning-button>
        <lightning-button label="Add Review" variant="brand" class="slds-m-left_x-small" onclick={handleAddReview}></lightning-button>
    </lightning-modal-footer>
</template>
